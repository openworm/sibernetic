name: Build using Intel drivers

on:
  push:
    branches: [ master, dev*, ow*, test* ]
  pull_request:
    branches: [ master, dev*, ow*, test* ]

jobs:

  build:

    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ ubuntu-24.04, ubuntu-26.04 ]

    steps:
    - name: Set git to use LF
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
        
    - uses: actions/checkout@v4

    - name: Install Intel OpenCL libraries needed for Sibernetic
      run: |

        lscpu

        echo "Installing OpenCL Drivers"

        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential \
              ocl-icd-libopencl1 \
              ocl-icd-opencl-dev \
              opencl-clhpp-headers \
              pocl-opencl-icd \
              mesa-opencl-icd \
              clinfo \
              python3-dev \
              freeglut3-dev \
              libglu1-mesa-dev

        echo "OpenCL Driver Installation Complete"


    - name: Build Sibernetic
      run: |

        python -V
        ls -alt /usr/bin/python*
        ls -alt
        make clean
        make

    - name: Print Sibernetic help
      run: |
        ./Release/Sibernetic -h

    - name: Print info on executable
      run: |
        ldd ./Release/Sibernetic

    - name: Run a quick simulation
      run: |

        ./Release/Sibernetic -no_g timelimit=0.001

    - name: Final version info
      run: |

        python -V
        pip list
